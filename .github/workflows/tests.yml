name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - name: Install only this wheel in a clean venv and run minimum demo
        run: python tests/standalone_acceptance.py --wheel dist/portfolio_decision_engine-0.7.0-py3-none-any.whl --out "$RUNNER_TEMP/portfolio-standalone"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-repository-acceptance
          path: |
            ${{ runner.temp }}/portfolio-standalone/acceptance.json
            ${{ runner.temp }}/portfolio-standalone/command-*.stdout
            ${{ runner.temp }}/portfolio-standalone/command-*.stderr
            ${{ runner.temp }}/portfolio-standalone/demo/
          retention-days: 7
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m portfolio_engine demo --fast --out reports/ci-demo
      - run: python -m portfolio_engine verify reports/ci-demo
      - run: python -m portfolio_engine convert-lookthrough --input examples/cn-lookthrough-demo.json --out reports/ci-lookthrough
      - run: python -m portfolio_engine verify reports/ci-lookthrough
      - run: python -m portfolio_engine m2-demo --fast --out reports/ci-m2
      - run: python -m portfolio_engine verify reports/ci-m2
      - run: python -m build

      - name: Workbench compatibility example
        run: |
          python -m portfolio_engine workbench-buy-hold --input examples/workbench-buy-hold.json --reference examples/workbench-buy-hold-reference.json --out reports/workbench-comparison
          python -m portfolio_engine verify reports/workbench-comparison

      - name: Account exposure teaching and limited evidence
        run: |
          python -m portfolio_engine account-exposure --input examples/account-exposure-demo.json --out reports/ci-account-exposure
          python -m portfolio_engine verify reports/ci-account-exposure
          python -m portfolio_engine account-exposure --input examples/account-exposure-limited-real.json --out reports/ci-account-limited
          python -m portfolio_engine verify reports/ci-account-limited

      - name: Original statistical counterexamples
        run: |
          python -m portfolio_engine statistics-demo --out reports/ci-statistics
          python -m portfolio_engine verify reports/ci-statistics

      - name: Conditional cash demand teaching scenarios
        run: |
          python -m portfolio_engine cash-demand --input examples/cash-demand-demo.json --out reports/ci-cash-demand
          python -m portfolio_engine verify reports/ci-cash-demand

      - name: Observed cashflow compatibility
        run: |
          python -m portfolio_engine workbench-observed-cashflow --input examples/workbench-observed-cashflow.json --out reports/ci-observed-cashflow
          python -m portfolio_engine verify reports/ci-observed-cashflow

      - name: Original observed review without third-party imports
        working-directory: src
        env:
          PYTHONIOENCODING: utf-8
        run: python -S -m portfolio_engine.observed_review ../examples/observed-review-demo.json --out ../reports/ci-original-observed
