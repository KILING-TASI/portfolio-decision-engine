name: Public evidence inventory
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/verify_public_validation.py --run-checks --output reports/public-validation-ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: public-validation-receipt
          path: reports/public-validation-ci.json
