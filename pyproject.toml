[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-decision-engine"
version = "0.8.2"
description = "Transparent portfolio research with drawdown budgets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "licenses/**/*.txt", "licenses/**/*.md"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "scipy>=1.12,<2", "scikit-learn>=1.4,<2", "statsmodels>=0.14,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
portfolio-decision-engine = "portfolio_engine._entry:main"
portfolio-engine = "portfolio_engine.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/portfolio-decision-engine" = ["THIRD_PARTY_NOTICES.md", "DISCLAIMER.md"]
"share/portfolio-decision-engine/docs" = ["docs/license-scope.md"]
"share/portfolio-decision-engine/licenses" = ["licenses/dependency-license-snapshot.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
