[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-decision-engine"
version = "0.11.0"
description = "Transparent portfolio research with drawdown budgets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "licenses/**/*.txt", "licenses/**/*.md"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
cnn = ["torch>=2.6,<3"]
analysis = ["numpy>=1.26,<3", "pandas>=2.2,<4", "scipy>=1.12,<2", "scikit-learn>=1.4,<2", "statsmodels>=0.14,<1"]
dev = ["pytest>=8,<10", "build>=1,<2", "numpy>=1.26,<3", "pandas>=2.2,<4", "scipy>=1.12,<2", "scikit-learn>=1.4,<2", "statsmodels>=0.14,<1"]

[project.scripts]
portfolio-decision-engine = "portfolio_engine._entry:main"
portfolio-engine = "portfolio_engine.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/portfolio-decision-engine" = ["CNN_RESEARCH.md", "FACTOR_REVIEW.md", "USAGE.md", "CASH_MIGRATION.md", "SHARED_CODE.json", "RIGHTS_INDEX.json", "CONTRIBUTING.md", "SECURITY.md", "LIFECYCLE.md", "README.en.md", "CHANGELOG.md", "AUDIT_SCOPE.md", "FORMAT_SCOPE.md", "EXPANSION.md", "BEGINNER.md", "SKILL.md", "THIRD_PARTY_NOTICES.md", "DISCLAIMER.md"]
"share/portfolio-decision-engine/docs" = ["docs/license-scope.md"]
"share/portfolio-decision-engine/examples" = ["examples/account-exposure-demo.json", "examples/cash-demand-demo.json", "examples/cn-lookthrough-demo.json", "examples/scheduled-cash-demo.json", "examples/exit-cash-demo.json"]
"share/portfolio-decision-engine/licenses" = ["licenses/dependency-license-snapshot.json"]

"share/portfolio-decision-engine/examples/expansion-teaching" = ["examples/expansion-teaching/panel.json", "examples/expansion-teaching/trials.json"]

"share/portfolio-decision-engine/examples/factor-review" = ["examples/factor-review/series.json", "examples/factor-review/exposure.json", "examples/factor-review/cost.json", "examples/factor-review/cashfit.json", "examples/factor-review/decay.json", "examples/factor-review/stability.json", "examples/factor-review/budget.json", "examples/factor-review/multi.json"]

"share/portfolio-decision-engine/examples/cnn-teaching" = ["examples/cnn-teaching/train.json", "examples/cnn-teaching/make_example.py", "examples/cnn-teaching/acceptance-record.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
